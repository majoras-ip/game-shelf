<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#3b2f5e}
@property --b{syntax:'<color>';inherits:true;initial-value:#e08a3c}
@property --c{syntax:'<color>';inherits:true;initial-value:#f3d9b1}
:root{
  transition:--a .7s ease, --b .7s ease, --c .7s ease;
  --room:#221d4a; --room-deep:#15122f; --ink:#f4f1ff; --muted:#aaa4d8; --plank:#3a3270;
  --a:#3b2f5e; --b:#e08a3c; --c:#f3d9b1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(var(--room),var(--room-deep));color:var(--ink);font-family:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.glow{position:fixed;width:1000px;height:1000px;left:-220px;top:-260px;border-radius:50%;background:var(--a);filter:blur(150px);opacity:.8;transition:background-color .7s ease;pointer-events:none}
.bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .9s ease;pointer-events:none}
.bgv.on{opacity:.6}
.bgblur{position:fixed;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) saturate(1.15);opacity:0;transition:opacity .9s ease;pointer-events:none}
.bgblur.on{opacity:.35}
.yt{position:fixed;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%) scale(1.18);border:0;pointer-events:none;opacity:0;transition:opacity .9s ease}
.yt.on{opacity:.55}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(21,18,47,.85) 0%,rgba(21,18,47,.35) 55%,rgba(21,18,47,.75) 100%),linear-gradient(transparent 55%,rgba(21,18,47,.95));opacity:0;transition:opacity .9s ease}
.shade.on{opacity:1}
.art{position:relative;display:grid;place-items:center;transition:opacity .26s ease, transform .38s cubic-bezier(.22,.9,.25,1)}
.art.to-left{opacity:0;transform:translateX(-46%) scale(.86) rotate(-4deg)}
.art.to-right{opacity:0;transform:translateX(46%) scale(.86) rotate(4deg)}
.info.to-left{opacity:0;transform:translateX(-60px)}
.info.to-right{opacity:0;transform:translateX(60px)}
.art.snap,.info.snap{transition:none}
.disc.roll-r svg{animation:roll-r .55s cubic-bezier(.2,.8,.2,1), spin 16s linear .55s infinite}
.disc.roll-l svg{animation:roll-l .55s cubic-bezier(.2,.8,.2,1), spin 16s linear .55s infinite}
@keyframes roll-r{from{transform:rotate(-200deg)}to{transform:rotate(0)}}
@keyframes roll-l{from{transform:rotate(200deg)}to{transform:rotate(0)}}

.info{transition:opacity .22s ease, transform .34s cubic-bezier(.22,.9,.25,1)}

.art .case{position:relative;z-index:1;width:76%;max-width:360px;border-radius:8px;overflow:hidden;box-shadow:0 30px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.12)}
.art .case img{display:block;width:100%;height:auto}
.art.has-cover .disc{position:absolute;width:64%;right:-10%;top:16%;z-index:0}
.app{position:relative;display:grid;grid-template-rows:auto 1fr auto;height:100vh;padding:28px 44px 0}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.count{color:var(--muted);font-size:15px}
.tools{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1.5px solid rgba(244,241,255,.2);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--room-deep);background:var(--ink);border-color:var(--ink)}
.chip:focus-visible,.search:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.search{font:inherit;font-size:15px;color:var(--ink);background:rgba(244,241,255,.09);border:1.5px solid transparent;border-radius:999px;padding:8px 16px;width:210px}
.search::placeholder{color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(260px,420px) 1fr;align-items:center;gap:60px;min-height:0;padding:10px 0}
.disc{display:grid;place-items:center;filter:drop-shadow(0 34px 44px rgba(0,0,0,.45));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.disc.mini{transform:scale(.8)}
.disc svg{width:100%;height:auto;display:block;animation:spin 16s linear infinite}
.disc.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:.2;translate:-40px 0}to{opacity:1;translate:0 0}}
.info h1{font-size:clamp(44px,6.2vw,96px);line-height:.94;letter-spacing:-.035em;font-weight:800;margin:0 0 20px;max-width:12ch;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:16px;margin-bottom:32px}
.tag{border-radius:6px;padding:3px 10px;background:var(--c);color:var(--room-deep);font-weight:600}
.play{font:inherit;font-weight:800;font-size:20px;color:var(--room-deep);background:var(--b);border:0;border-radius:999px;padding:14px 32px 14px 14px;display:inline-flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s, background-color .7s}
.play:hover{transform:translateY(-2px)}
.play:active{transform:scale(.97)}
.play:disabled{opacity:.6;cursor:wait}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.btn-a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--room-deep);color:var(--b);font-size:16px}
.status{min-height:24px;margin-top:18px;font-size:15px;color:var(--ink)}
.status.err{color:#ffb3b3}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.empty h1{max-width:none}
.spines{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding:30px 6px 0;scrollbar-width:none}
.spines::-webkit-scrollbar{display:none}
.spine{flex:0 0 auto;width:58px;height:240px;border:0;border-radius:6px 6px 0 0;background:var(--sa);color:var(--sc);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 12px;transition:transform .25s cubic-bezier(.2,.8,.2,1), width .25s;box-shadow:inset -7px 0 0 rgba(0,0,0,.2), inset 3px 0 0 rgba(255,255,255,.14)}
.spine .t{writing-mode:vertical-rl;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:200px}
.spine .s{font-size:11px;font-weight:600;padding:2px 5px;border-radius:4px;background:var(--sb);color:var(--sa)}
.spine[aria-selected="true"]{transform:translateY(-24px);width:70px}
.spine:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.plank{height:24px;background:var(--plank);border-top:3px solid rgba(244,241,255,.22);margin:0 -44px}
.pad{display:none;color:var(--muted);font-size:13px}
.pad.on{display:inline}
.veil{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .6s ease}
body.launching .veil{opacity:1;transition:opacity .75s ease .35s}
body.launching .art{transition:transform 1.05s cubic-bezier(.65,0,.25,1), opacity .5s ease .6s;transform:translateX(38%) scale(2.7);opacity:0}
body.launching .info,body.launching header,body.launching .spines,body.launching .plank{opacity:0;transition:opacity .3s ease}
body.launching .disc svg{animation-duration:.9s}
body.returning .veil{opacity:0;transition:opacity .6s ease}
body.ingame *{animation-play-state:paused!important}
body.ingame .glow{filter:none;opacity:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.resume{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:rgba(244,241,255,.12);border:1.5px solid rgba(244,241,255,.28);border-radius:999px;padding:11px 22px 11px 11px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
.resume:hover{transform:translateY(-2px)}
.resume:focus-visible{outline:3px solid var(--b);outline-offset:4px}
.resume small{font-weight:400;color:var(--muted);font-size:13px}
.btn-x{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#3a6fe0;color:#fff;font-size:13px;font-weight:800}
.ctl{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--muted);font-size:14px}
.ctl[hidden]{display:none}
.ctl select{font:inherit;font-size:14px;color:var(--ink);background:rgba(244,241,255,.09);border:1.5px solid rgba(244,241,255,.2);border-radius:10px;padding:6px 10px;max-width:260px}
.ctl select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.newlayout{margin-top:14px;padding:16px;border-radius:14px;background:rgba(244,241,255,.07);border:1.5px solid rgba(244,241,255,.16);max-width:460px;display:grid;gap:12px}
.newlayout[hidden]{display:none}
.newlayout label{display:grid;gap:6px;color:var(--muted);font-size:13px}
.newlayout select,.newlayout input{font:inherit;font-size:15px;color:var(--ink);background:rgba(10,8,30,.45);border:1.5px solid rgba(244,241,255,.2);border-radius:10px;padding:8px 10px}
.newlayout input:focus-visible,.newlayout select:focus-visible,.newlayout button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.newlayout .row{display:flex;gap:10px}
.newlayout .save{font:inherit;font-weight:700;background:var(--b);color:var(--room-deep);border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
.newlayout .cancel{font:inherit;background:transparent;color:var(--muted);border:1.5px solid rgba(244,241,255,.2);border-radius:999px;padding:8px 16px;cursor:pointer}
.newlayout .desc{font-size:13px;color:var(--muted);margin:0}
.shots{display:flex;gap:10px;margin-top:20px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.shots::-webkit-scrollbar{display:none}
.shots button{flex:0 0 auto;width:132px;aspect-ratio:4/3;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:zoom-in;background:#0006;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.shots button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.shots-label{color:var(--muted);font-size:13px;margin-top:20px}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(10,8,25,.92);display:none;place-items:center;padding:40px}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 60px #000a}
.lightbox p{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:var(--muted);font-size:14px;margin:0}
.toasts{position:fixed;right:20px;bottom:44px;z-index:25;display:grid;gap:8px;max-width:340px}
.toast{background:rgba(15,12,35,.92);border:1.5px solid rgba(244,241,255,.18);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink);box-shadow:0 10px 30px #0008}
.toast b{display:block;font-weight:700;margin-bottom:2px}
.toast.running b::after{content:'';display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;border:2px solid var(--b);border-right-color:transparent;animation:spin 1s linear infinite;vertical-align:-1px}
.toast.error{border-color:#ff9a9a}
.fixbtn{font:inherit;font-weight:700;font-size:14px;margin-left:10px;padding:5px 14px;border-radius:999px;border:0;background:var(--b);color:var(--room-deep);cursor:pointer}
.fixbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){body.launching .art{transform:none}.art,.info{transition:opacity .15s}.art.to-left,.art.to-right,.info.to-left,.info.to-right{transform:none}.disc.roll-r svg,.disc.roll-l svg{animation:none}.disc svg,.disc.pop{animation:none}.spine,.disc,.glow{transition:none}}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;padding:20px 16px 0}
  .tools{margin-left:0;width:100%}
  .search{flex:1;width:auto}
  .stage{grid-template-columns:1fr;gap:16px}
  .disc{max-width:260px;margin:0 auto}
  .plank{margin:0 -16px}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<video class="bgblur" id="bgblur" muted loop playsinline preload="auto" aria-hidden="true"></video>
<video class="bgv" id="bgv" loop playsinline preload="auto" aria-hidden="true"></video>
<iframe class="yt" id="yt" title="Background video" tabindex="-1" aria-hidden="true" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div class="shade" id="shade" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Screenshot"><img id="lbimg" alt=""><p>Left and right for more. B or Esc to close.</p></div>
<div class="app">
  <header>
    <h2 class="brand">Game shelf</h2>
    <span class="count" id="count"></span>
    <span class="pad" id="pad">Controller connected</span>
    <button class="chip" id="snd" aria-pressed="true" title="Sound on or off (M)">Sound on</button>
    <div class="tools">
      <div role="group" aria-label="Filter by system" id="filters"></div>
      <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="art" id="art" aria-hidden="true"><div class="case" id="case" hidden></div><div class="disc" id="disc"></div></div>
    <div class="info" id="info"></div>
  </main>

  <div>
    <div class="spines" id="spines" role="listbox" aria-label="Your games" aria-orientation="horizontal"></div>
    <div class="plank" aria-hidden="true"></div>
  </div>
</div>

<script>
// Original color sets matched to each game's mood. No official art is used.
const PALETTES = [
  [/twilight/i,               {a:'#3b2f5e', b:'#e08a3c', c:'#f3d9b1', pattern:'rays'}],
  [/zelda/i,                  {a:'#2f6b4f', b:'#d9b44a', c:'#efe6c8', pattern:'rings'}],
  [/luigi|mansion/i,          {a:'#1d4a57', b:'#9fecd2', c:'#e6fff6', pattern:'dots'}],
  [/kart|double dash/i,       {a:'#a8242c', b:'#f5c400', c:'#fff4cc', pattern:'checker'}],
  [/sunshine/i,               {a:'#1a76b5', b:'#ffb347', c:'#fff1dc', pattern:'waves'}],
  [/resident|evil/i,          {a:'#4a1f22', b:'#c9a46b', c:'#efe2cc', pattern:'rings'}],
];
const FALLBACK = [
  {a:'#4b3f8f', b:'#7fd1ff', c:'#eef6ff', pattern:'rings'},
  {a:'#6b2f5b', b:'#ff9ec7', c:'#ffe8f2', pattern:'dots'},
  {a:'#2d5d3a', b:'#b8e86b', c:'#f1fbe1', pattern:'waves'},
  {a:'#5a3b1e', b:'#ffcf6b', c:'#fff4da', pattern:'rays'},
  {a:'#1f3f6b', b:'#ff8f6b', c:'#ffeee6', pattern:'checker'},
];
const SYSTEM_ORDER = ['GameCube', 'Wii', 'Wii U', 'NES', 'SNES', 'N64', 'Game Boy', 'GBA', 'Genesis', 'PS1', 'PS2', 'PSP', 'Xbox', 'Homebrew'];
const SHORT = {'GameCube': 'GC', 'Game Boy': 'GB', 'Genesis': 'GEN', 'Wii U': 'WiiU', 'Homebrew': 'HB'};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let firstPaint = true, games = [], view = [], index = 0, filter = 'All', query = '', busy = false, firstLoad = true;

function paletteFor(title){
  for (const [re, p] of PALETTES) if (re.test(title)) return p;
  let h = 0; for (const ch of title) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return FALLBACK[h % FALLBACK.length];
}
function sizeText(n){ return n >= 1e9 ? (n/1e9).toFixed(1) + ' GB' : Math.round(n/1e6) + ' MB'; }
function ago(ts){
  if (!ts) return 'Not played yet';
  const m = (Date.now()/1000 - ts) / 60;
  if (m < 2) return 'Played just now';
  if (m < 60) return `Played ${Math.round(m)} min ago`;
  const h = m / 60; if (h < 24) return `Played ${Math.round(h)} hr ago`;
  const d = h / 24; if (d < 2) return 'Played yesterday';
  if (d < 30) return `Played ${Math.round(d)} days ago`;
  return 'Played ' + new Date(ts*1000).toLocaleDateString();
}

function discSVG(g){
  const {a, b, c, pattern} = g.pal, id = 'd' + Math.random().toString(36).slice(2, 8);
  let pat = '';
  if (pattern === 'rings') {
    for (let i = 0; i < 9; i++) pat += `<circle cx="200" cy="200" r="${76 + i*15}" fill="none" stroke="${i%2 ? b : c}" stroke-width="6" opacity="${i%2 ? 1 : .45}"/>`;
    pat += `<rect x="186" y="10" width="28" height="60" rx="6" fill="${c}" opacity=".9"/>`;
  } else if (pattern === 'rays') {
    for (let i = 0; i < 24; i++) {
      const t1 = i*Math.PI/12, t2 = (i+.5)*Math.PI/12;
      pat += `<path d="M200 200L${200+300*Math.cos(t1)} ${200+300*Math.sin(t1)}L${200+300*Math.cos(t2)} ${200+300*Math.sin(t2)}Z" fill="${i%3 ? b : c}" opacity="${i%3 ? .85 : .6}"/>`;
    }
  } else if (pattern === 'checker') {
    for (let y = 0; y < 400; y += 40) for (let x = 0; x < 400; x += 40)
      if (((x + y) / 40) % 2 === 0) pat += `<rect x="${x}" y="${y}" width="40" height="40" fill="${c}" opacity=".9"/>`;
    pat += `<circle cx="200" cy="200" r="120" fill="none" stroke="${b}" stroke-width="26"/>`;
  } else if (pattern === 'waves') {
    for (let i = 0; i < 9; i++) {
      const y = 40 + i*42;
      pat += `<path d="M-20 ${y} Q 40 ${y-26} 100 ${y} T 220 ${y} T 340 ${y} T 460 ${y}" fill="none" stroke="${i%2 ? b : c}" stroke-width="14" stroke-linecap="round" opacity="${i%2 ? 1 : .55}"/>`;
    }
  } else {
    for (let y = 20; y < 400; y += 34) for (let x = 20 + ((y/34)%2)*17; x < 400; x += 34)
      pat += `<circle cx="${x}" cy="${y}" r="7" fill="${c}" opacity=".75"/>`;
    pat += `<circle cx="290" cy="130" r="46" fill="${b}"/>`;
  }
  return `<svg viewBox="0 0 400 400">
    <defs>
      <mask id="${id}m"><rect width="400" height="400" fill="#fff"/><circle cx="200" cy="200" r="22" fill="#000"/></mask>
      <clipPath id="${id}c"><circle cx="200" cy="200" r="196"/></clipPath>
      <radialGradient id="${id}s" cx="28%" cy="22%" r="85%"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <g mask="url(#${id}m)">
      <g clip-path="url(#${id}c)"><rect width="400" height="400" fill="${a}"/>${g.discImg
        ? `<image href="${g.discImg}" x="0" y="0" width="400" height="400" preserveAspectRatio="xMidYMid slice"/>`
        : g.cover
        ? `<image href="${g.cover}" x="0" y="0" width="400" height="400" preserveAspectRatio="xMidYMid slice"/><rect width="400" height="400" fill="${a}" opacity=".12"/>`
        : pat}</g>
      <circle cx="200" cy="200" r="196" fill="url(#${id}s)"/>
      <circle cx="200" cy="200" r="195" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3"/>
      ${g.discImg ? '' : `<circle cx="200" cy="200" r="64" fill="#dedcec"/>
      <circle cx="200" cy="200" r="64" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="2"/>
      <circle cx="200" cy="200" r="40" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="6"/>`}
    </g>
  </svg>`;
}

function hex(r, g, b){ return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function coverPalette(g){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 32;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 32, 32);
        const d = ctx.getImageData(0, 0, 32, 32).data;
        let sr = 0, sg = 0, sb = 0, n = 0, best = null, bestScore = -1;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], gg = d[i+1], b = d[i+2];
          const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), sat = mx ? (mx - mn) / mx : 0, lum = (r + gg + b) / 3;
          sr += r; sg += gg; sb += b; n++;
          const score = sat * (lum > 70 && lum < 235 ? 1 : 0.3);
          if (score > bestScore) { bestScore = score; best = [r, gg, b]; }
        }
        const avg = [sr/n, sg/n, sb/n];
        const a = hex(avg[0]*.45, avg[1]*.45, avg[2]*.45);
        const bc = hex(...best);
        const cc = hex(best[0]*.25 + 255*.75, best[1]*.25 + 255*.75, best[2]*.25 + 255*.75);
        res({...g.pal, a, b: bc, c: cc});
      } catch (e) { res(g.pal); }
    };

function trimDisc(url){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const W = 200, H = Math.round(200 * img.height / img.width);
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
        const d = x.getImageData(0, 0, W, H).data;
        const px = (i, j) => { const k = (j * W + i) * 4; return [d[k], d[k+1], d[k+2]]; };
        const corners = [px(1,1), px(W-2,1), px(1,H-2), px(W-2,H-2)];
        const bg = [0,1,2].map(k => corners.reduce((s, c) => s + c[k], 0) / 4);
        let x0 = W, y0 = H, x1 = 0, y1 = 0;
        for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
          const p = px(i, j), diff = Math.abs(p[0]-bg[0]) + Math.abs(p[1]-bg[1]) + Math.abs(p[2]-bg[2]);
          if (diff > 60) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
        }
        let cx, cy, r;
        if (x1 - x0 > W * 0.3 && y1 - y0 > H * 0.3) { cx = (x0 + x1) / 2; cy = (y0 + y1) / 2; r = Math.max(x1 - x0, y1 - y0) / 2; }
        else { cx = W / 2; cy = H / 2; r = Math.min(W, H) / 2; }
        const s = img.width / W, out = document.createElement('canvas'); out.width = out.height = 600;
        out.getContext('2d').drawImage(img, (cx - r) * s, (cy - r) * s, 2 * r * s, 2 * r * s, 0, 0, 600, 600);
        res(out.toDataURL('image/jpeg', 0.92));
      } catch (e) { res(url); }
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

  if (!g || !g.bg || g.yt || b.contains('launching') || b.contains('ingame') || busy) return;
  const want = new URL(g.bg, location.href).href;
  if (v.src !== want) setBackground(g.bg);
  else if (v.paused || !v.classList.contains('on')) startVideo(v);
}, 1500);
// Blurred copy fills the edges so the video doesn't need to be zoomed in
setInterval(() => {
  const v = $('#bgv'), b = $('#bgblur');
  const src = v.getAttribute('src');
  if ((b.getAttribute('src') || null) !== (src || null)) { if (src) b.src = src; else { b.removeAttribute('src'); b.load(); } }
  b.classList.toggle('on', v.classList.contains('on'));
  if (!src) return;
  if (v.paused && !b.paused) b.pause();
  else if (!v.paused) { if (b.paused) b.play().catch(() => {}); if (Math.abs(b.currentTime - v.currentTime) > 0.3) b.currentTime = v.currentTime; }
}, 400);
let lastSig = null, shownJobs = {};
async function pollChanges(){
  if (document.body.classList.contains('launching')) return;
  try {
    const d = await (await fetch('/api/changes', {cache: 'no-store'})).json();
    if (lastSig && d.sig !== lastSig && !busy) load();
    lastSig = d.sig;
    const box = $('#toasts');
    box.innerHTML = (d.jobs || []).map(j => `<div class="toast ${j.state}"><b>${esc(j.title)}</b>${esc(j.msg || '')}</div>`).join('');
    for (const j of d.jobs || []) {
      if (j.state === 'done' && !shownJobs[j.id]) { shownJobs[j.id] = 1; load(); }
    }
  } catch (e) {}
}
setInterval(pollChanges, 3000); pollChanges();
const unlock = () => { const v = $('#bgv'); if (!v.src || document.body.classList.contains('launching')) return; if (v.paused) startVideo(v); else if (soundOn && v.muted) { v.muted = false; v.volume = 0; fadeVolume(v, VOL, 500); } };
addEventListener('pointerdown', unlock); addEventListener('keydown', unlock);
load();
</script>
